<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在 — VaIMod</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<style>
:root{
  --bg:#0d1117; --panel:#151b23; --border:#232b36; --border-soft:#1c242e;
  --text:#e6edf3; --muted:#8b98a5; --faint:#5b6773;
  --accent:#4493f8; --danger:#f85149;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --sans:'Inter','Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.65;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::selection{background:rgba(68,147,248,.35)}
a{color:inherit;text-decoration:none}
nav{border-bottom:1px solid var(--border-soft)}
.nav-in{max-width:1080px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.logo .mark{width:27px;height:27px;display:block;flex-shrink:0;filter:drop-shadow(0 2px 10px rgba(68,147,248,.3))}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:64px 24px;text-align:center;position:relative}
main::before{content:"";position:absolute;inset:0;background:radial-gradient(560px 280px at 50% -40px,rgba(68,147,248,.14),transparent 70%);pointer-events:none}
.nf{position:relative}
.nf-code{font-size:clamp(96px,20vw,220px);font-weight:800;letter-spacing:-.03em;line-height:1}
.nf-code .grad{background:linear-gradient(120deg,#58a6ff,#4493f8 45%,#bc8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.nf-title{font-size:clamp(20px,3vw,28px);font-weight:800;margin-top:18px}
.nf-desc{color:var(--muted);margin-top:12px}
.nf-path{font-family:var(--mono);font-size:12.5px;color:var(--danger);background:#0a0e13;border:1px solid rgba(248,81,73,.35);border-radius:9px;display:inline-block;max-width:92%;padding:10px 18px;margin-top:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.nf-cta{margin-top:36px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:10px;font-weight:600;font-size:15px;transition:.2s;border:1px solid transparent}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 24px rgba(68,147,248,.28)}
.btn-primary:hover{background:#3d87ec;transform:translateY(-1px)}
.btn-ghost{border-color:var(--border);color:var(--text);background:var(--panel)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:480px){.nf-cta{flex-direction:column;align-items:stretch}.btn{width:100%;justify-content:center}}
footer{border-top:1px solid var(--border-soft);padding:26px 24px;color:var(--faint);font-size:13px;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="logo" href="/"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="vlg-404" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4493f8"/><stop offset="1" stop-color="#1f6feb"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#vlg-404)"/><path d="M9 10.5 L16 22 L23 10.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="10.5" r="2" fill="#fff"/></svg>VaIMod</a>
  </div>
</nav>

<main>
  <div class="nf">
    <div class="nf-code">4<span class="grad">0</span>4</div>
    <div class="nf-title">页面不存在</div>
    <p class="nf-desc">这个地址不在 VaIMod 的地图上——它可能从未存在，也可能已被移动。</p>
    <div class="nf-path" id="nf-path">unknown</div>
    <div class="nf-cta">
      <a class="btn btn-primary" href="/">返回主页</a>
      <a class="btn btn-ghost" href="/VaIMod/">前往安装页</a>
      <a class="btn btn-ghost" href="https://github.com/VaIMod/VaIMod" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</main>

<footer>VaIMod — ccw.site 变量手术台 · Not affiliated with ccw.site</footer>

<script>
try {
  var p = decodeURIComponent(location.pathname);
  document.getElementById('nf-path').textContent = p;
  document.getElementById('nf-path').title = p;
} catch (e) {
  document.getElementById('nf-path').textContent = location.pathname;
}
</script>
</body>
</html>
